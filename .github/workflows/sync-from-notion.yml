name: Sync handbook from Notion

on:
  schedule:
    - cron: "17 4 * * *"  # nightly; odd minute to dodge GitHub's top-of-hour cron congestion
  workflow_dispatch:  # for rendering a Notion edit right away
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

# A second render racing the first would fight over the notion-sync branch.
concurrency:
  group: sync-from-notion

env:
  PYTHON_DEFAULT_VERSION: "3.11"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: notion_sync/package-lock.json
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - name: Install dependencies
        run: python -m pip install --upgrade nox pip setuptools
      - name: Render handbook
        run: nox -vs sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_HANDBOOK_ROOT: ${{ vars.NOTION_HANDBOOK_ROOT }}
      - name: Create or update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: notion-sync
          commit-message: Regenerate handbook content from Notion
          # Default author is the triggering actor or whoever merged to master / last edited this workflow file.
          author: Notion Sync <notion-sync-action@invalid>
          committer: Notion Sync <notion-sync-action@invalid>
          title: Regenerate handbook content from Notion
          body: Automated render of the Notion handbook
          delete-branch: true
