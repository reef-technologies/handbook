name: Sync handbook from Notion

on:
  workflow_dispatch:  # manual only while the sync cadence is undecided
  push:
    branches: [notion-migration]  # TEMP: remove before merge

permissions:
  contents: write
  pull-requests: write

# A second render racing the first would fight over the notion-sync branch.
concurrency:
  group: notion-sync

env:
  PYTHON_DEFAULT_VERSION: "3.11"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: notion_sync/package-lock.json
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - name: Install dependencies
        run: python -m pip install --upgrade nox pip setuptools
      - name: Render handbook
        run: nox -vs sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_HANDBOOK_ROOT: ${{ vars.NOTION_HANDBOOK_ROOT }}
      - name: Create or update sync PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: notion-sync
          commit-message: Regenerate handbook content from Notion
          title: Regenerate handbook content from Notion
          body: Automated render of the Notion handbook (`nox -s sync`).
          delete-branch: true
